name: Shorts Studio Claude usage
# A read-only account check. No model calls and no video creation.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shorts-studio-usage.yml'
      - 'shorts-studio/cloud/claude_usage.py'
      - 'shorts-studio/cloud/usage_report.py'
permissions:
  contents: read
concurrency:
  group: shorts-studio-usage
  cancel-in-progress: false
jobs:
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: shorts-studio/cloud
      - name: Read Claude usage and report percentages
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STUDIO_PAGE_URL: ${{ vars.STUDIO_PAGE_URL }}
          STUDIO_NOTIFY_KEY: ${{ secrets.STUDIO_NOTIFY_KEY }}
        run: python3 shorts-studio/cloud/usage_report.py
