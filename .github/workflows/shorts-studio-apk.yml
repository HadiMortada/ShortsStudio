name: Build Shorts Studio APK
on:
  pull_request:
    paths:
      - 'shorts-studio/**'
      - '.github/workflows/shorts-studio-apk.yml'
  push:
    paths:
      - 'shorts-studio/**'
      - '.github/workflows/shorts-studio-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: shorts-studio
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ShortsStudio-debug-apk
          path: shorts-studio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
