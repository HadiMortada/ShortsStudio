name: Build Shorts Studio APK
on:
  pull_request:
    paths:
      - 'shorts-studio/**'
      - '.github/workflows/shorts-studio-apk.yml'
  push:
    paths:
      - 'shorts-studio/**'
      - '.github/workflows/shorts-studio-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify cloud director and phone login
        run: |
          python -m pip install -r shorts-studio/cloud/requirements.txt
          python -m unittest discover -s shorts-studio/cloud -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Locate the retained debug signing key
        id: signing
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request?.head?.ref || context.ref.replace('refs/heads/', '');
            const { data } = await github.rest.actions.listArtifactsForRepo({ ...context.repo, name: 'ShortsStudio-debug-signing', per_page: 100 });
            const prior = data.artifacts.find(a => !a.expired && a.workflow_run?.head_branch === branch);
            core.setOutput('run_id', prior ? String(prior.workflow_run.id) : '');
      - uses: actions/download-artifact@v4
        if: steps.signing.outputs.run_id != ''
        with:
          name: ShortsStudio-debug-signing
          run-id: ${{ steps.signing.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/shorts-signing
      - name: Prepare the retained debug signing key
        env:
          STUDIO_SIGNING_KEYSTORE: ${{ runner.temp }}/shorts-signing/debug.keystore
        run: |
          mkdir -p "$(dirname "$STUDIO_SIGNING_KEYSTORE")"
          if [ ! -s "$STUDIO_SIGNING_KEYSTORE" ]; then
            keytool -genkeypair -keystore "$STUDIO_SIGNING_KEYSTORE" -storepass android \
              -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -validity 10000 -noprompt
          fi
      - name: Build debug APK
        env:
          STUDIO_SIGNING_KEYSTORE: ${{ runner.temp }}/shorts-signing/debug.keystore
        working-directory: shorts-studio
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ShortsStudio-debug-apk
          path: shorts-studio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Retain signing key for subsequent updates
        if: github.event_name == 'push' && success()
        uses: actions/upload-artifact@v4
        with:
          name: ShortsStudio-debug-signing
          path: ${{ runner.temp }}/shorts-signing/debug.keystore
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90


