name: Shorts Studio CI
# Runs for code changes only. The page and the film jobs save small data files many times a day
# (autopilot settings, ideas, history, upload receipts); testing on each of those wasted Actions minutes.
on:
  pull_request:
    paths:
      - 'shorts-studio/**'
      - '!shorts-studio/autopilot/**'
      - '!shorts-studio/ledger/**'
      - '.github/workflows/shorts-studio-ci.yml'
  push:
    branches: [main]
    paths:
      - 'shorts-studio/**'
      - '!shorts-studio/autopilot/**'
      - '!shorts-studio/ledger/**'
      - '.github/workflows/shorts-studio-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q shorts-studio/server shorts-studio/motion/cloud_render.py shorts-studio/motion/cloud_publish.py
      - run: PYTHONPATH=shorts-studio/server python -m unittest discover -s shorts-studio/server/tests -v
      - run: python -m pip install -r shorts-studio/cloud/requirements.txt
      # FFmpeg lets the video editor's test really cut, clean and caption a clip and check lip sync.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python -m unittest discover -s shorts-studio/cloud -v

  motion:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: shorts-studio/motion
      - run: npx tsc --noEmit
        working-directory: shorts-studio/motion
      - run: npx remotion compositions src/index.tsx
        working-directory: shorts-studio/motion
      - name: Smoke-render 45 frames of the 1080p composition
        run: |
          npx remotion render src/index.tsx StudioShort /tmp/shorts-smoke.mp4 --frames=0-44 --codec=h264 --crf=24 --concurrency=2 --log=error
          test -s /tmp/shorts-smoke.mp4
        working-directory: shorts-studio/motion


  voice:
    # The film narrators: the offline backup voice must record; the online one is only reported.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -q -r shorts-studio/cloud/requirements-actions.txt
          python -m piper.download_voices en_US-ryan-high en_US-lessac-high ar_JO-kareem-medium --data-dir "$RUNNER_TEMP/voices"
      - name: Record with the offline voices
        env:
          STUDIO_OFFLINE_VOICES: ${{ runner.temp }}/voices
        working-directory: shorts-studio/cloud
        run: |
          python - <<'PY'
          import asyncio, tempfile
          from pathlib import Path
          from production import audio_seconds, offline_voice
          lines = [('en-US-GuyNeural', 'The solstice is the shortest day, but not the earliest sunset.'),
                   ('en-US-JennyNeural', 'Sunlight scatters in the air, and blue light scatters most.'),
                   ('ar-LB-RamiNeural', 'الشمس تشرق كل يوم من الشرق.')]
          with tempfile.TemporaryDirectory() as root:
              for voice, text in lines:
                  out = Path(root) / (voice + '.mp3')
                  asyncio.run(offline_voice(text, voice, out))
                  print(voice, round(audio_seconds(out), 2), 'seconds')
          PY
      - name: Check the online voice service (report only)
        continue-on-error: true
        working-directory: shorts-studio/cloud
        run: |
          python - <<'PY'
          import asyncio, tempfile
          from pathlib import Path
          from production import audio_seconds, neural_voice
          with tempfile.TemporaryDirectory() as root:
              out = Path(root) / 'a.mp3'
              asyncio.run(neural_voice('Why is the sky blue?', 'en-US-AndrewMultilingualNeural', out, waits=(2, 5)))
              print('Online voice works:', round(audio_seconds(out), 2), 'seconds')
          PY
      - name: Check one-take narration lines up with the scenes (report only)
        continue-on-error: true
        working-directory: shorts-studio/cloud
        run: |
          python - <<'PY'
          import asyncio, json, tempfile
          from pathlib import Path
          from production import align_beats, neural_voice
          films = {'en-US-AndrewMultilingualNeural': ['Ever noticed your shower curtain creeping toward you?',
                       "It's not a ghost. The spray drags air down, and that air spins into a little whirlwind.",
                       'Its center has slightly lower pressure, about 1% less, so the curtain gets pulled in.',
                       "That's why it hugs your legs every time!"],
                   'ar-LB-RamiNeural': ['هل لاحظت أن ستارة الحمام تقترب منك؟', 'السبب ليس شبحاً، بل الهواء الذي يدور بفعل الماء.',
                       'في مركز هذه الدوامة يكون الضغط أقل، فتنسحب الستارة نحوك.']}
          with tempfile.TemporaryDirectory() as root:
              for voice, beats in films.items():
                  out = Path(root) / 'take.mp3'
                  asyncio.run(neural_voice(' '.join(beats), voice, out, waits=(2, 5)))
                  words = json.loads(out.with_suffix('.words.json').read_text())
                  cues = align_beats(beats, words)
                  print(voice, len(words), 'words;', 'scenes:', [(c['start'], c['end']) for c in cues] if cues else 'NOT ALIGNED')
                  if not cues:
                      print('Words:', [w['text'] for w in words])
                      raise SystemExit(1)
          PY
