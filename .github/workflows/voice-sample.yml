name: Voice samples (temporary)
# Makes Arabic narration samples to compare voices, then saves them to this branch.
on:
  push:
    branches: [ccr-7a3bd53b-e60083]
    paths: ['.github/workflows/voice-sample.yml']

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          date; ffmpeg -version | head -1   # already on GitHub's machines
          # SILMA's own dependency set (torch, torchvision, torchaudio from PyPI, all matching).
          timeout 900 python -m pip install --progress-bar off --timeout 60 silma-tts edge-tts
          date
      - name: Make the samples
        run: |
          mkdir -p samples
          cat > /tmp/texts.json <<'JSON'
          {"physics": "هل تساءلتَ يومًا لماذا ينزلقُ الناسُ على الجليد؟ لعقودٍ طويلة، ظنَّ العلماءُ أنَّ ضغطَ أقدامِنا يُذيبُ سطحَه. لكنَّ الأرقامَ لا تتّفق. والحقيقةُ أغرب: طبقةٌ رقيقةٌ تشبهُ الماءَ تغطّي الجليدَ دائمًا، حتى في البردِ القارس.",
           "story": "في ليلةٍ صحراويّةٍ باردة، وصلَ ابنُ بطّوطة إلى مخيّمِ القافلة. كانت النارُ تتراقصُ بينَ الخيام، والإبلُ تستريحُ تحتَ نجومٍ لا تُحصى. جلسَ يستمعُ إلى حكاياتِ التجّار، ولم يكن يعلمُ أنَّ رحلتَه ستمتدُّ ثلاثين عامًا."}
          JSON
          python - <<'PY'
          import json, time, subprocess, asyncio, pathlib
          texts = json.load(open('/tmp/texts.json'))
          report = []
          # SILMA with its built-in Arabic narrator voice
          from silma_tts.api import SilmaTTS
          import silma_tts, os
          started = time.time()
          tts = SilmaTTS()
          report.append(f'SILMA model load: {time.time() - started:.0f} s')
          import numpy as np
          def pitch(path):
              # Median voice pitch (Hz): men are usually about 85-160, women about 165-260.
              raw = subprocess.check_output(['ffmpeg', '-v', 'error', '-i', str(path), '-f', 's16le', '-ac', '1', '-ar', '16000', '-'])
              x = np.frombuffer(raw, np.int16).astype(np.float32)
              found = []
              for i in range(0, len(x) - 1024, 800):
                  f = x[i:i + 1024]
                  if np.abs(f).mean() < 500:
                      continue
                  c = np.correlate(f, f, 'full')[1023:]
                  lo, hi = 16000 // 400, 16000 // 70
                  lag = lo + int(np.argmax(c[lo:hi]))
                  if c[lag] > 0.3 * c[0]:
                      found.append(16000 / lag)
              return float(np.median(found)) if found else 0.0
          # SILMA's built-in Arabic reference recording (installed with the package, else from its demo).
          import sys, urllib.request
          found = [p for d in sys.path if d and pathlib.Path(d).is_dir() for p in pathlib.Path(d).glob('silma_tts/**/ar.ref.24k.wav')]
          ref = found[0] if found else pathlib.Path('/tmp/ar.ref.24k.wav')
          if not found:
              urllib.request.urlretrieve('https://huggingface.co/spaces/silma-ai/silma-tts-v1-demo/resolve/main/ar.ref.24k.wav', ref)
          ref_text = 'ويدقق النظر في القرآن الكريم وسائر الكتب السماوية ويتبع مسالك الرسل العظام عليهم الصلاة والسلام.'
          report.append(f'Built-in SILMA voice pitch: {pitch(ref):.0f} Hz')
          # A male reference for this comparison only: the Microsoft Hamed voice reading one sentence.
          male_text = 'أهلًا بكم، في هذه الحلقة نروي لكم قصةً من التاريخ، فاستمعوا جيدًا.'
          import edge_tts
          asyncio.run(edge_tts.Communicate(male_text, 'ar-SA-HamedNeural', rate='-8%').save('/tmp/male.mp3'))
          subprocess.run(['ffmpeg', '-y', '-v', 'error', '-i', '/tmp/male.mp3', '-ar', '24000', '-ac', '1', '/tmp/male.wav'], check=True)
          report.append(f'Male reference pitch: {pitch("/tmp/male.wav"):.0f} Hz')
          # The current free Microsoft voices, for comparison
          async def edge(voice, text, path):
              await edge_tts.Communicate(text, voice, rate='-2%').save(path)
          for voice in ('ar-SA-HamedNeural', 'ar-EG-ShakirNeural'):
              for name, text in [('story', texts['story'])]:
                  try:
                      asyncio.run(edge(voice, text, f'samples/microsoft-{voice.split("-")[1].lower()}-{voice.split("-")[2].replace("Neural","").lower()}-{name}.mp3'))
                  except Exception as error:
                      report.append(f'{voice} {name}: {error}')
          def save(note):
              report.append(note)
              print(note, flush=True)
              pathlib.Path('samples/README.txt').write_text('\n'.join(report) + '\n')
              # Save each clip as soon as it exists, so a slow run still delivers something.
              subprocess.run('git add samples && git commit -q -m "Add an Arabic voice sample" && git push -q', shell=True)
          subprocess.run(['git', 'config', 'user.name', 'shorts-studio-bot'])
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'])
          for voice, ref_file, ref_words in (('male', '/tmp/male.wav', male_text), ('builtin', ref, ref_text)):
              for name, text in [('story', texts['story'])]:
                  for speed in (0.95,):
                      started = time.time()
                      out = f'/tmp/silma-{voice}-{name}-{speed}.wav'
                      tts.infer(ref_file=str(ref_file), ref_text=ref_words, gen_text=text, file_wave=out, seed=7, speed=speed)
                      took = time.time() - started
                      mp3 = f'samples/silma-{voice}-{name}{"-slower" if speed == 0.9 else ""}.mp3'
                      subprocess.run(['ffmpeg', '-y', '-v', 'error', '-i', out, '-b:a', '128k', mp3], check=True)
                      length = float(subprocess.check_output(['ffprobe', '-v', 'error', '-show_entries', 'format=duration', '-of', 'csv=p=0', mp3]))
                      save(f'{mp3}: {length:.1f} s of speech made in {took:.0f} s')
          pathlib.Path('samples/README.txt').write_text('\n'.join(report) + '\n')
          print('\n'.join(report))
          PY
      - name: Save the samples to this branch
        run: |
          git config user.name "shorts-studio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samples
          git commit -m "Add Arabic voice samples (SILMA and Microsoft)" || exit 0
          git push
