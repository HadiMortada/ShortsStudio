name: Shorts Studio Claude film
# Free, serverless film creation with the AI chosen in Settings: Claude Code (your Claude
# subscription) or ChatGPT through OpenAI's Codex CLI (your ChatGPT subscription). When it cannot
# finish (usage limit, sign-in, any error) a free backup writer takes over.
# Remotion renders on GitHub's runner; a second job saves the film to the private library
# (a draft release your Shorts Studio page reads) and can upload it to YouTube. Autopilot films are
# started by shorts-studio-autopilot.yml at your post times.
# Setup: shorts-studio/README.md → "Free mode".
run-name: ${{ !inputs.resume_run && inputs.slot && format('Autopilot film {0}', inputs.slot) || format('Film {0}', inputs.request_id || inputs.brief || 'autopilot') }}
on:
  workflow_dispatch:
    inputs:
      brief:
        description: 'Creative brief (leave empty to use shorts-studio/autopilot/settings.json)'
        required: false
        type: string
      seconds:
        description: 'Target length in seconds (15-60)'
        required: false
        default: '30'
        type: string
      voice:
        description: 'Narrator'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - en-US-AndrewMultilingualNeural
          - en-US-AvaMultilingualNeural
          - en-US-GuyNeural
          - en-US-JennyNeural
          - en-GB-RyanNeural
          - en-GB-SoniaNeural
          - ar-LB-RamiNeural
          - ar-LB-LaylaNeural
          - ar-SA-HamedNeural
          - ar-SA-ZariyahNeural
      writer:
        description: 'auto = the AI from Settings (Claude or ChatGPT), then the free backup if it cannot finish; claude = that AI only'
        required: false
        default: auto
        type: choice
        options: [auto, claude, backup]
      research:
        description: 'Let the AI search the web while writing'
        required: false
        default: auto
        type: choice
        options: [auto, 'off']
      publish:
        description: 'Upload to YouTube when the film is ready (needs YOUTUBE_OAUTH_JSON)'
        required: false
        default: false
        type: boolean
      privacy:
        description: 'YouTube visibility'
        required: false
        default: private
        type: choice
        options: [private, unlisted, public]
      request_id:
        description: 'Set by the Shorts Studio page to follow this run (leave empty)'
        required: false
        type: string
      slot:
        description: 'Autopilot post time, set by the hourly autopilot check (leave empty)'
        required: false
        type: string
      instagram:
        description: 'Instagram account IDs to post the film to as a Reel (set by the page; leave empty)'
        required: false
        type: string
      youtube:
        description: 'YouTube channel id to post to (set by the page; empty = the default channel)'
        required: false
        type: string
      resume_run:
        description: 'Failed film run to continue (set by the page; leave empty)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: shorts-studio-claude-film
  cancel-in-progress: false

jobs:
  account:
    uses: ./.github/workflows/shorts-studio-claude-account.yml
    secrets:
      CLAUDE_ACCOUNT_OAUTH_JSON: ${{ secrets.CLAUDE_ACCOUNT_OAUTH_JSON }}
      CHATGPT_ACCOUNT_JSON: ${{ secrets.CHATGPT_ACCOUNT_JSON }}
      STUDIO_GITHUB_TOKEN: ${{ secrets.STUDIO_GITHUB_TOKEN }}
      STUDIO_NOTIFY_KEY: ${{ secrets.STUDIO_NOTIFY_KEY }}
  film:
    needs: account
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      models: read   # free GitHub Models for the backup writer
      actions: read  # an earlier try's film files, so a retry does not use Claude again
    outputs:
      state: ${{ steps.create.outputs.state }}
      deliver: ${{ steps.create.outputs.deliver }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore a continued film and save its request
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN: ${{ inputs.resume_run }}
        run: |
          mkdir -p "$RUNNER_TEMP/previous" "$RUNNER_TEMP/film"
          if [ -n "$RESUME_RUN" ]; then
            [[ "$RESUME_RUN" =~ ^[0-9]{1,20}$ ]] || exit 1
            gh run download "$RESUME_RUN" -R "$GITHUB_REPOSITORY" -n "shorts-studio-film-$RESUME_RUN" -D "$RUNNER_TEMP/previous" \
              || echo "No saved files available; continuing from the original brief."
          fi
          python3 shorts-studio/cloud/film_resume.py "$RUNNER_TEMP/film" "$RUNNER_TEMP/previous"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Usually under a minute. GitHub's package mirror sometimes hangs (one film waited 28 minutes
      # here), so each download is time-limited and tried again instead of waiting.
      - name: Install fonts, FFmpeg and Python packages
        timeout-minutes: 15
        run: |
          apt=(sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          for try in 1 2 3; do
            timeout 180 "${apt[@]}" update -qq \
              && timeout 300 "${apt[@]}" install -y -qq ffmpeg fonts-noto-core fonts-dejavu-core fonts-noto-color-emoji \
              && break
            echo "::warning::Downloading system packages was slow or failed (try $try of 3); trying again."
            sleep 10
          done
          command -v ffmpeg > /dev/null || { echo "::error::FFmpeg could not be installed. Try the film again."; exit 1; }
          timeout 420 python -m pip install -q --retries 5 --timeout 30 -r shorts-studio/cloud/requirements-actions.txt
      # Offline backup narrator (Piper, open source). Used only when Microsoft's free voice service is down.
      - name: Keep the offline voices between runs
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/voices
          key: shorts-studio-piper-voices-v1
      - name: Get the offline backup voices
        run: |
          python -m piper.download_voices en_US-ryan-high en_US-lessac-high ar_JO-kareem-medium --data-dir "$RUNNER_TEMP/voices" \
            || echo "::warning::Offline backup voices could not be downloaded; films need the online voice service."
      - name: Install Claude Code
        if: needs.account.outputs.provider != 'chatgpt'
        run: npm install -g --no-audit --no-fund @anthropic-ai/claude-code@2.1.322
      - name: Install Codex CLI (ChatGPT)
        if: needs.account.outputs.provider == 'chatgpt'
        run: npm install -g --no-audit --no-fund --loglevel=error @openai/codex@0.170.0
      - name: Prepare the Remotion renderer
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p render/runner && cd render
          npm init -y > /dev/null
          npm install --save-exact --no-audit --no-fund \
            remotion@4.0.421 @remotion/cli@4.0.421 @remotion/bundler@4.0.421 @remotion/renderer@4.0.421 \
            @remotion/shapes@4.0.421 @remotion/paths@4.0.421 @remotion/noise@4.0.421 @remotion/transitions@4.0.421 \
            react@18.3.1 react-dom@18.3.1
          npx remotion browser ensure
          cp "$GITHUB_WORKSPACE/shorts-studio/cloud/render/render.mjs" runner/render.mjs
      - name: Get the film Claude wrote in an earlier try at this post time
        if: inputs.slot != '' && inputs.resume_run == ''
        env:
          GH_TOKEN: ${{ github.token }}
          SLOT: ${{ inputs.slot }}
        run: |
          mkdir -p "$RUNNER_TEMP/previous"
          gh run list -R "$GITHUB_REPOSITORY" --workflow shorts-studio-claude.yml --status failure --limit 40 \
            --json databaseId,displayTitle \
            --jq "map(select(.displayTitle == \"Autopilot film $SLOT\")) | .[].databaseId" > "$RUNNER_TEMP/tries.txt" || true
          # Keep how each earlier try ended (previous/tries/), so a try that ran out of Claude time
          # is never repeated the same way; reuse a film Claude already wrote.
          mkdir -p "$RUNNER_TEMP/previous/tries"
          while read -r run; do
            [[ "$run" =~ ^[0-9]{1,20}$ ]] || continue
            rm -rf "$RUNNER_TEMP/try"; mkdir -p "$RUNNER_TEMP/try"
            gh run download "$run" -R "$GITHUB_REPOSITORY" -n "shorts-studio-film-$run" -D "$RUNNER_TEMP/try" 2>/dev/null || continue
            if [ -s "$RUNNER_TEMP/try/delivery.json" ]; then cp "$RUNNER_TEMP/try/delivery.json" "$RUNNER_TEMP/previous/tries/$run.json"; fi
            if [ -s "$RUNNER_TEMP/try/design.json" ]; then
              cp -r "$RUNNER_TEMP/try/." "$RUNNER_TEMP/previous/"; echo "Reusing the film from run $run"; break
            fi
          done < "$RUNNER_TEMP/tries.txt"
      # Autopilot picks its subject from what people watch most: the topic's most-viewed recent Shorts.
      # The YouTube sign-in is used only in this step, never given to Claude or the renderer.
      - name: Find the Shorts people watch most on this topic
        if: inputs.slot != '' && inputs.resume_run == ''
        continue-on-error: true
        env:
          YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
          YOUTUBE_ACCOUNTS_JSON: ${{ secrets.YOUTUBE_ACCOUNTS_JSON }}
          SLOT: ${{ inputs.slot }}
        run: timeout 120 python shorts-studio/cloud/trends.py --slot "$SLOT" --out "$RUNNER_TEMP/views.json"
      - name: Create the film
        id: create
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The AI chosen in Settings (claude or chatgpt) and its run-bound sign-in.
          STUDIO_AI: ${{ needs.account.outputs.provider }}
          STUDIO_CLAUDE_ACCESS: ${{ needs.account.outputs.provider != 'chatgpt' && needs.account.outputs.access_envelope || '' }}
          STUDIO_CHATGPT_ACCESS: ${{ needs.account.outputs.provider == 'chatgpt' && needs.account.outputs.access_envelope || '' }}
          STUDIO_PAGE_URL: ${{ vars.STUDIO_PAGE_URL }}
          STUDIO_NOTIFY_KEY: ${{ secrets.STUDIO_NOTIFY_KEY }}
          # The backup writer's GitHub Models calls; never given to Claude or the renderer.
          STUDIO_MODELS_TOKEN: ${{ github.token }}
          # Generated animation code renders with no secrets and no network except loopback.
          STUDIO_RENDER_SANDBOX: netns
          # Optional premium narration (Settings → Connectors). Higgsfield needs no secret here:
          # the page hands the job a short-lived token for the owner's signed-in plan.
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          STUDIO_OFFLINE_VOICES: ${{ runner.temp }}/voices
          STUDIO_CHROMIUM: ''
          SLOT: ${{ inputs.slot }}
          BRIEF: ${{ inputs.brief }}
          SECONDS_INPUT: ${{ inputs.seconds || '30' }}
          VOICE: ${{ inputs.voice || 'auto' }}
          WRITER: ${{ inputs.writer || 'auto' }}
          RESEARCH: ${{ inputs.research || 'auto' }}
          PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
          PRIVACY: ${{ inputs.privacy || 'private' }}
          INSTAGRAM: ${{ inputs.instagram }}
          YOUTUBE_CHANNEL: ${{ inputs.youtube }}
          RESUME_RUN: ${{ inputs.resume_run }}
        run: |
          args=(--renderer "$RUNNER_TEMP/render" --out "$RUNNER_TEMP/film" --writer "$WRITER"
                --seconds "$SECONDS_INPUT" --voice "$VOICE" --research "$RESEARCH" --privacy "$PRIVACY")
          if [ -s "$RUNNER_TEMP/views.json" ]; then args+=(--views "$RUNNER_TEMP/views.json"); fi
          if [ -n "$SLOT" ]; then args+=(--slot "$SLOT" --previous "$RUNNER_TEMP/previous"); else args+=(--brief "$BRIEF" --instagram "$INSTAGRAM" --youtube "$YOUTUBE_CHANNEL"); fi
          if [ -n "$RESUME_RUN" ]; then args+=(--resume --previous "$RUNNER_TEMP/previous"); fi
          if [ "$PUBLISH" = "true" ]; then args+=(--publish); fi
          python shorts-studio/cloud/actions_film.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shorts-studio-film-${{ github.run_id }}
          path: ${{ runner.temp }}/film/
          if-no-files-found: ignore
          retention-days: 14

  deliver:
    needs: film
    if: needs.film.outputs.deliver == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'google-api-python-client>=2,<3' 'google-auth>=2,<3'
      - uses: actions/download-artifact@v4
        with:
          name: shorts-studio-film-${{ github.run_id }}
          path: ${{ runner.temp }}/film
      - name: Save to the library, record autopilot history and upload to YouTube
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
          YOUTUBE_ACCOUNTS_JSON: ${{ secrets.YOUTUBE_ACCOUNTS_JSON }}  # every connected channel, by id
          STUDIO_PAGE_URL: ${{ vars.STUDIO_PAGE_URL }}
          STUDIO_NOTIFY_KEY: ${{ secrets.STUDIO_NOTIFY_KEY }}
        run: python shorts-studio/cloud/actions_deliver.py "$RUNNER_TEMP/film"
