name: Shorts Studio publish
# Started by "Publish" in the Shorts Studio Library: uploads the chosen films to YouTube, now or
# scheduled, and records the result in the private library. Never posts a film twice.
run-name: Publish ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      films:
        description: 'JSON list of {"run": "...", "publishAt": "..."} (set by the page)'
        required: true
        type: string
      privacy:
        description: 'YouTube visibility'
        required: false
        default: public
        type: choice
        options: [public, unlisted, private]
      hashtags:
        description: 'Hashtags to add, separated by spaces (empty = the ones saved in Settings)'
        required: false
        type: string
      request_id:
        description: 'Set by the Shorts Studio page (leave empty)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: shorts-studio-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # library index and upload ledger
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            shorts-studio/cloud
            shorts-studio/autopilot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'google-api-python-client>=2,<3' 'google-auth>=2,<3'
      - name: Publish to YouTube
        env:
          FILMS: ${{ inputs.films }}
          PRIVACY: ${{ inputs.privacy }}
          HASHTAGS: ${{ inputs.hashtags }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
          STUDIO_PAGE_URL: ${{ vars.STUDIO_PAGE_URL }}
          STUDIO_NOTIFY_KEY: ${{ secrets.STUDIO_NOTIFY_KEY }}
        run: python shorts-studio/cloud/actions_publish.py
