name: Shorts Studio autopilot
# Manual fallback for the autopilot check. The Shorts Studio page itself checks the post times
# every 5 minutes (Cloudflare Cron Trigger), because GitHub's own schedules can run hours late. Post times, days and timezone come from shorts-studio/autopilot/settings.json,
# which the Shorts Studio page edits. Films that post publicly are scheduled on YouTube for
# the exact time.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shorts-studio-autopilot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write  # start the film workflow
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            shorts-studio/cloud
            shorts-studio/autopilot
      - name: Start the film for a due post time
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STUDIO_PAGE_URL: ${{ vars.STUDIO_PAGE_URL }}
          STUDIO_NOTIFY_KEY: ${{ secrets.STUDIO_NOTIFY_KEY }}
        run: |
          python3 -m pip install -q 'pydantic>=2,<3'
          python3 shorts-studio/cloud/autopilot_check.py
