name: Shorts Studio web page
# Tests the Cloudflare Worker page. Deploying from here is optional: Cloudflare's own Git
# integration (Workers Builds) also deploys it, using wrangler.jsonc at the repository root.
# Needs repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, STUDIO_PASSWORD,
# STUDIO_GITHUB_TOKEN. Until they exist, the deploy step is skipped with a notice.
on:
  push:
    branches: [main]
    paths:
      - 'shorts-studio/web/**'
      - 'wrangler.jsonc'
      - '.github/workflows/shorts-studio-web.yml'
  pull_request:
    paths:
      - 'shorts-studio/web/**'
      - 'wrangler.jsonc'
      - '.github/workflows/shorts-studio-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shorts-studio-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/*.test.js
        working-directory: shorts-studio/web

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Cloudflare setup
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STUDIO_PASSWORD: ${{ secrets.STUDIO_PASSWORD }}
          STUDIO_GITHUB_TOKEN: ${{ secrets.STUDIO_GITHUB_TOKEN }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID STUDIO_PASSWORD STUDIO_GITHUB_TOKEN; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::notice::Add these repository secrets, then run this workflow again:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: '22'
      - name: Deploy to Cloudflare
        if: steps.check.outputs.ready == 'true'
        working-directory: shorts-studio/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STUDIO_PASSWORD: ${{ secrets.STUDIO_PASSWORD }}
          STUDIO_GITHUB_TOKEN: ${{ secrets.STUDIO_GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          npm ci --no-audit --no-fund
          npx wrangler deploy --config ../../wrangler.jsonc --var "GITHUB_REPO:$REPO" --var "GITHUB_BRANCH:$BRANCH" | tee deploy.log
          printf '%s' "$STUDIO_PASSWORD" | npx wrangler secret put STUDIO_PASSWORD --config ../../wrangler.jsonc
          printf '%s' "$STUDIO_GITHUB_TOKEN" | npx wrangler secret put STUDIO_GITHUB_TOKEN --config ../../wrangler.jsonc
          url=$(grep -Eo 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "## Shorts Studio is live" >> "$GITHUB_STEP_SUMMARY"
          echo "Open ${url:-your workers.dev address from the Cloudflare dashboard} on your phone and add it to your home screen." >> "$GITHUB_STEP_SUMMARY"
