name: Prepare Shorts Studio AI account
# Prepares the AI chosen in Settings ("ai" in shorts-studio/autopilot/settings.json):
#   claude  → the Claude account login (Claude Code)
#   chatgpt → the ChatGPT sign-in (OpenAI's Codex CLI)
# Only this serialized job holds the refresh credential. Dependent jobs get a run-bound,
# encrypted, short-lived access handoff and the provider name.
on:
  workflow_call:
    outputs:
      access_envelope:
        description: 'Run-bound encrypted access token; no refresh credential'
        value: ${{ jobs.account.outputs.access_envelope }}
      provider:
        description: 'claude or chatgpt'
        value: ${{ jobs.account.outputs.provider }}
    secrets:
      CLAUDE_ACCOUNT_OAUTH_JSON:
        required: false
      CHATGPT_ACCOUNT_JSON:
        required: false
      STUDIO_GITHUB_TOKEN:
        required: false
      STUDIO_NOTIFY_KEY:
        required: false
permissions:
  contents: read
jobs:
  account:
    outputs:
      access_envelope: ${{ steps.prepare.outputs.access_envelope }}
      provider: ${{ steps.choice.outputs.provider }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The sign-in workflows share this group: a refresh credential is never
    # consumed concurrently or allowed to overwrite a newer phone sign-in.
    concurrency:
      group: shorts-studio-claude-account
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            shorts-studio/cloud/ai.py
            shorts-studio/cloud/claude_account.py
            shorts-studio/cloud/chatgpt_account.py
            shorts-studio/autopilot/settings.json
          sparse-checkout-cone-mode: false
      - name: Which AI
        id: choice
        run: echo "provider=$(cd shorts-studio/cloud && python3 -c 'import ai; print(ai.provider({}))')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official Claude Code
        if: steps.choice.outputs.provider == 'claude'
        run: npm install -g --no-audit --no-fund --loglevel=error @anthropic-ai/claude-code@2.1.322
      - name: Install official Codex CLI (ChatGPT)
        if: steps.choice.outputs.provider == 'chatgpt'
        run: npm install -g --no-audit --no-fund --loglevel=error @openai/codex@0.170.0
      - name: Prepare account without a model request
        id: prepare
        env:
          AI: ${{ steps.choice.outputs.provider }}
          CLAUDE_ACCOUNT_OAUTH_JSON: ${{ secrets.CLAUDE_ACCOUNT_OAUTH_JSON }}
          CHATGPT_ACCOUNT_JSON: ${{ secrets.CHATGPT_ACCOUNT_JSON }}
          STUDIO_GITHUB_TOKEN: ${{ secrets.STUDIO_GITHUB_TOKEN }}
          STUDIO_NOTIFY_KEY: ${{ secrets.STUDIO_NOTIFY_KEY }}
        run: |
          if [ "$AI" = "chatgpt" ]; then
            python3 shorts-studio/cloud/chatgpt_account.py
          else
            python3 shorts-studio/cloud/claude_account.py
          fi
